<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="stingray-detector">
  <defs>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d6"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#16202e"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- forward radar / signal sweep -->
  <g fill="none" stroke="#5eead4" stroke-linecap="round">
    <path d="M190 94 A 92 92 0 0 1 322 94"  stroke-width="9" opacity="0.9"/>
    <path d="M162 86 A 130 130 0 0 1 350 86" stroke-width="8" opacity="0.55"/>
    <path d="M136 80 A 168 168 0 0 1 376 80" stroke-width="7" opacity="0.3"/>
  </g>

  <!-- stingray, top-down swept-wing silhouette -->
  <path fill="url(#ray)" d="M256 118
    C318 122 372 150 410 210 C432 246 452 250 470 256
    C446 270 410 300 360 340 C322 370 286 392 256 402
    C226 392 190 370 152 340 C102 300 66 270 42 256
    C60 250 80 246 102 210 C140 150 194 122 256 118 Z"/>
  <!-- whip tail -->
  <path fill="none" stroke="url(#ray)" stroke-width="12" stroke-linecap="round"
    d="M256 402 C260 448 282 472 322 494"/>
</svg>
